<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Assinantes</title>
<style>
  :root{
    --paper:#EDEAE1;
    --paper-dark:#E2DECF;
    --ink:#20262E;
    --ink-soft:#5B6470;
    --rule:#C9C2AE;
    --masthead-red:#8A2E27;
    --active-gold:#9C7A2E;
    --inactive-grey:#8B8B85;
    --white:#FBFAF6;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  header.masthead{
    padding:22px 20px 16px;
    border-bottom:3px double var(--ink);
    text-align:center;
    background:var(--paper);
  }
  header.masthead h1{
    font-family:var(--serif);
    font-size:clamp(28px,6vw,42px);
    letter-spacing:0.5px;
    margin:0;
    font-weight:700;
  }
  header.masthead p{
    margin:4px 0 0;
    font-size:13px;
    color:var(--ink-soft);
    font-style:italic;
  }
  .toolbar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    padding:14px 16px;
    background:var(--paper-dark);
    border-bottom:1px solid var(--rule);
    position:sticky;
    top:0;
    z-index:5;
  }
  .toolbar input[type="text"]{
    flex:1 1 180px;
    min-width:0;
    padding:9px 12px;
    border:1px solid var(--rule);
    border-radius:3px;
    font-size:14px;
    background:var(--white);
    color:var(--ink);
  }
  button{
    font-family:var(--sans);
    cursor:pointer;
    border:none;
    border-radius:3px;
    font-size:13px;
    padding:9px 14px;
    font-weight:600;
  }
  .btn-primary{background:var(--ink); color:var(--white);}
  .btn-secondary{background:var(--white); color:var(--ink); border:1px solid var(--rule);}
  .btn-danger{background:var(--masthead-red); color:var(--white);}
  .btn-primary:hover, .btn-secondary:hover, .btn-danger:hover{opacity:0.88;}
  main{max-width:900px; margin:0 auto; padding:12px 12px 60px;}
  #status{padding:10px 16px; font-size:13px; color:var(--ink-soft);}
  .row-card{
    background:var(--white);
    border:1px solid var(--rule);
    border-left:4px solid var(--inactive-grey);
    border-radius:3px;
    padding:12px 14px;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    transition:box-shadow .15s ease;
  }
  .row-card.ativo{border-left-color:var(--active-gold);}
  .row-card:hover{box-shadow:0 1px 6px rgba(0,0,0,0.08);}
  .row-numero{
    font-family:var(--serif);
    font-size:13px;
    color:var(--ink-soft);
    width:34px;
    flex-shrink:0;
  }
  .row-main{flex:1; min-width:0;}
  .row-nome{font-weight:600; font-size:15px;}
  .row-sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .badge{
    font-size:11px;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    flex-shrink:0;
  }
  .badge.ativo{background:#F2E9CE; color:var(--active-gold);}
  .badge.inativo{background:#EAE9E5; color:var(--inactive-grey);}
  .empty{text-align:center; padding:40px 16px; color:var(--ink-soft); font-style:italic;}

  .overlay{
    position:fixed; inset:0; background:rgba(32,38,46,0.5);
    display:none; align-items:flex-start; justify-content:center;
    padding:24px 12px; overflow-y:auto; z-index:20;
  }
  .overlay.open{display:flex;}
  .panel{
    background:var(--white);
    max-width:520px; width:100%;
    border-radius:5px;
    padding:24px;
    margin-bottom:40px;
  }
  .panel h2{font-family:var(--serif); margin:0 0 4px; font-size:22px;}
  .panel .panel-sub{font-size:12.5px; color:var(--ink-soft); margin-bottom:18px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:4px;}
  .field input, .field select, .field textarea{
    width:100%; padding:9px 10px; border:1px solid var(--rule); border-radius:3px;
    font-size:14px; font-family:var(--sans); background:var(--paper);
  }
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .section-title{
    font-size:12px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--masthead-red); font-weight:700; margin:20px 0 10px;
    border-top:1px solid var(--rule); padding-top:14px;
  }
  .ativo-toggle{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .ativo-toggle label{font-size:13px; font-weight:600;}
  .switch{position:relative; width:44px; height:24px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0;}
  .slider{
    position:absolute; inset:0; background:var(--inactive-grey); border-radius:24px;
    cursor:pointer; transition:.15s;
  }
  .slider:before{
    content:""; position:absolute; height:18px; width:18px; left:3px; bottom:3px;
    background:white; border-radius:50%; transition:.15s;
  }
  .switch input:checked + .slider{background:var(--active-gold);}
  .switch input:checked + .slider:before{transform:translateX(20px);}
  .panel-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:22px;}

  #reportOverlay .panel{max-width:640px;}
  .report-list{list-style:none; margin:0; padding:0;}
  .report-list li{padding:8px 0; border-bottom:1px solid var(--rule); font-size:14px;}
  .report-list .rl-nome{font-weight:600;}
  .report-list .rl-sub{color:var(--ink-soft); font-size:12.5px;}

  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute; top:0; left:0; width:100%; padding:20px;}
  }
  #printArea{display:none;}
</style>
</head>
<body>

<header class="masthead">
  <h1>Gestão de Assinantes</h1>
  <p>Listagem, pagamentos e estado de assinatura</p>
</header>

<div class="toolbar">
  <input type="text" id="searchInput" placeholder="Pesquisar por nome, nº ou localidade…">
  <button class="btn-secondary" id="filterActiveBtn">Só ativos</button>
  <button class="btn-secondary" id="reportBtn">Relatório de impressão</button>
  <button class="btn-primary" id="addBtn">+ Novo assinante</button>
</div>

<main>
  <div id="status">A carregar…</div>
  <div id="list"></div>
</main>

<!-- Painel de edição -->
<div class="overlay" id="editOverlay">
  <div class="panel">
    <h2 id="editTitle">Assinante</h2>
    <div class="panel-sub" id="editSub"></div>

    <div class="ativo-toggle">
      <label class="switch">
        <input type="checkbox" id="f_ativo">
        <span class="slider"></span>
      </label>
      <label for="f_ativo">Assinante ativo</label>
    </div>

    <div class="field"><label>Nome</label><input id="f_nome" type="text"></div>
    <div class="field-row">
      <div class="field"><label>Nº assinante</label><input id="f_numero" type="text"></div>
      <div class="field"><label>NIF</label><input id="f_nif" type="text"></div>
    </div>
    <div class="field"><label>Morada completa</label><input id="f_morada" type="text"></div>
    <div class="field-row">
      <div class="field"><label>Localidade</label><input id="f_localidade" type="text"></div>
      <div class="field"><label>Código postal</label><input id="f_codigoPostal" type="text"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Contacto</label><input id="f_contacto" type="text"></div>
      <div class="field"><label>E-mail</label><input id="f_email" type="text"></div>
    </div>
    <div class="field"><label>Data de nascimento</label><input id="f_nascimento" type="text" placeholder="AAAA/MM/DD"></div>

    <div class="section-title">Pagamento da anuidade</div>
    <div class="field-row">
      <div class="field"><label>Termo da assinatura</label><input id="f_termo" type="text" placeholder="ex: dezembro/2026"></div>
      <div class="field"><label>Data do pagamento</label><input id="f_dataPagamento" type="date"></div>
    </div>
    <div class="field">
      <label>Método</label>
      <select id="f_modo">
        <option value="">—</option>
        <option value="Numerário">Numerário</option>
        <option value="Transferência Bancária">Transferência Bancária</option>
        <option value="MBWAY AmorMais">MBWAY</option>
      </select>
    </div>
    <div class="field"><label>Notas</label><textarea id="f_notas" rows="2"></textarea></div>

    <div class="panel-actions">
      <button class="btn-secondary" id="cancelBtn">Cancelar</button>
      <button class="btn-primary" id="saveBtn">Guardar</button>
    </div>
  </div>
</div>

<!-- Painel de relatório -->
<div class="overlay" id="reportOverlay">
  <div class="panel">
    <h2>Relatório — assinantes ativos</h2>
    <div class="panel-sub" id="reportCount"></div>
    <ul class="report-list" id="reportList"></ul>
    <div class="panel-actions">
      <button class="btn-secondary" id="closeReportBtn">Fechar</button>
      <button class="btn-primary" id="printBtn">Imprimir</button>
    </div>
  </div>
</div>

<div id="printArea">
  <h2 style="font-family:Georgia,serif;">Assinantes ativos</h2>
  <table style="width:100%; border-collapse:collapse; font-family:sans-serif; font-size:13px;">
    <thead>
      <tr style="border-bottom:2px solid #000; text-align:left;">
        <th style="padding:6px 4px;">Nome</th>
        <th style="padding:6px 4px;">Morada</th>
        <th style="padding:6px 4px;">Código Postal</th>
      </tr>
    </thead>
    <tbody id="printBody"></tbody>
  </table>
</div>

<script>
// -------- CONFIGURAÇÃO --------
// Depois de publicares o Apps Script como aplicação Web, cola aqui o URL que te é dado.
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzAmi4CxrSFnHg4A04QRK1Qz6hlHum3eVO8SdBm5bVJG2fddciDqmeVkDYV-ioepKaO/exec";
// --------------------------------

let subscribers = [];
let showOnlyActive = false;
let editingRow = null; // null = novo assinante

const els = {
  status: document.getElementById('status'),
  list: document.getElementById('list'),
  search: document.getElementById('searchInput'),
};

async function apiGet(){
  const res = await fetch(SCRIPT_URL, { method:'GET' });
  return res.json();
}

async function apiPost(payload){
  const res = await fetch(SCRIPT_URL, {
    method:'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita pre-flight CORS
    body: JSON.stringify(payload)
  });
  return res.json();
}

function isAtivo(s){
  const v = (s.ativo || '').toString().trim().toLowerCase();
  return v === 'sim' || v === 'true' || v === 'x';
}

async function loadData(){
  if (SCRIPT_URL.indexOf('COLOCAR_AQUI') !== -1){
    els.status.textContent = 'Falta configurar o URL do Apps Script no ficheiro (constante SCRIPT_URL).';
    return;
  }
  els.status.textContent = 'A carregar…';
  try{
    const data = await apiGet();
    if (!data.ok) throw new Error(data.error || 'Erro desconhecido');
    subscribers = data.subscribers;
    render();
  }catch(err){
    els.status.textContent = 'Erro ao ligar à Google Sheet: ' + err.message;
  }
}

function render(){
  const term = els.search.value.trim().toLowerCase();
  let filtered = subscribers.filter(s => {
    if (showOnlyActive && !isAtivo(s)) return false;
    if (!term) return true;
    return (s.nome||'').toLowerCase().includes(term)
      || (s.numero||'').toString().toLowerCase().includes(term)
      || (s.localidade||'').toLowerCase().includes(term);
  });

  els.status.textContent = `${filtered.length} de ${subscribers.length} assinantes`;
  els.list.innerHTML = '';

  if (filtered.length === 0){
    els.list.innerHTML = '<div class="empty">Nenhum assinante encontrado.</div>';
    return;
  }

  filtered.sort((a,b) => (parseInt(a.numero)||0) - (parseInt(b.numero)||0));

  filtered.forEach(s => {
    const card = document.createElement('div');
    card.className = 'row-card' + (isAtivo(s) ? ' ativo' : '');
    card.innerHTML = `
      <div class="row-numero">${s.numero || '—'}</div>
      <div class="row-main">
        <div class="row-nome">${s.nome || '(sem nome)'}</div>
        <div class="row-sub">${s.localidade || ''}${s.termo ? ' · até ' + s.termo : ''}</div>
      </div>
      <div class="badge ${isAtivo(s) ? 'ativo' : 'inativo'}">${isAtivo(s) ? 'Ativo' : 'Inativo'}</div>
    `;
    card.addEventListener('click', () => openEdit(s));
    els.list.appendChild(card);
  });
}

function openEdit(s){
  editingRow = s ? s.rowIndex : null;
  document.getElementById('editTitle').textContent = s ? 'Editar assinante' : 'Novo assinante';
  document.getElementById('editSub').textContent = s ? ('Nº ' + (s.numero||'—')) : 'Preenche os dados do novo assinante';

  const set = (id, val) => document.getElementById(id).value = val || '';
  set('f_nome', s?.nome);
  set('f_numero', s?.numero);
  set('f_nif', s?.nif);
  set('f_morada', s?.morada);
  set('f_localidade', s?.localidade);
  set('f_codigoPostal', s?.codigoPostal);
  set('f_contacto', s?.contacto);
  set('f_email', s?.email);
  set('f_nascimento', s?.nascimento);
  set('f_termo', s?.termo);
  set('f_modo', s?.modo);
  set('f_notas', s?.notas);
  document.getElementById('f_dataPagamento').value = s?.dataPagamento || '';
  document.getElementById('f_ativo').checked = s ? isAtivo(s) : false;

  document.getElementById('editOverlay').classList.add('open');
}

function closeEdit(){
  document.getElementById('editOverlay').classList.remove('open');
  editingRow = null;
}

async function saveEdit(){
  const data = {
    nome: document.getElementById('f_nome').value,
    numero: document.getElementById('f_numero').value,
    nif: document.getElementById('f_nif').value,
    morada: document.getElementById('f_morada').value,
    localidade: document.getElementById('f_localidade').value,
    codigoPostal: document.getElementById('f_codigoPostal').value,
    contacto: document.getElementById('f_contacto').value,
    email: document.getElementById('f_email').value,
    nascimento: document.getElementById('f_nascimento').value,
    termo: document.getElementById('f_termo').value,
    dataPagamento: document.getElementById('f_dataPagamento').value,
    modo: document.getElementById('f_modo').value,
    notas: document.getElementById('f_notas').value,
    ativo: document.getElementById('f_ativo').checked ? 'Sim' : 'Não',
  };

  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = 'A guardar…';

  try{
    const payload = editingRow
      ? { action:'update', rowIndex: editingRow, data }
      : { action:'add', data };
    const result = await apiPost(payload);
    if (!result.ok) throw new Error(result.error || 'Erro ao guardar');

    if (editingRow){
      const idx = subscribers.findIndex(s => s.rowIndex === editingRow);
      if (idx !== -1) subscribers[idx] = result.subscriber;
    } else {
      subscribers.push(result.subscriber);
    }
    render();
    closeEdit();
  }catch(err){
    alert('Não foi possível guardar: ' + err.message);
  }finally{
    saveBtn.disabled = false;
    saveBtn.textContent = 'Guardar';
  }
}

function openReport(){
  const ativos = subscribers.filter(isAtivo).sort((a,b) => (a.nome||'').localeCompare(b.nome||''));
  document.getElementById('reportCount').textContent = `${ativos.length} assinantes ativos`;
  const list = document.getElementById('reportList');
  list.innerHTML = ativos.map(s => `
    <li>
      <div class="rl-nome">${s.nome || '—'}</div>
      <div class="rl-sub">${s.morada || ''} — ${s.codigoPostal || ''}</div>
    </li>
  `).join('');

  document.getElementById('printBody').innerHTML = ativos.map(s => `
    <tr style="border-bottom:1px solid #ccc;">
      <td style="padding:6px 4px;">${s.nome || ''}</td>
      <td style="padding:6px 4px;">${s.morada || ''}</td>
      <td style="padding:6px 4px;">${s.codigoPostal || ''}</td>
    </tr>
  `).join('');

  document.getElementById('reportOverlay').classList.add('open');
}

document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('filterActiveBtn').addEventListener('click', (e) => {
  showOnlyActive = !showOnlyActive;
  e.target.style.background = showOnlyActive ? 'var(--ink)' : '';
  e.target.style.color = showOnlyActive ? 'var(--white)' : '';
  render();
});
document.getElementById('addBtn').addEventListener('click', () => openEdit(null));
document.getElementById('cancelBtn').addEventListener('click', closeEdit);
document.getElementById('saveBtn').addEventListener('click', saveEdit);
document.getElementById('reportBtn').addEventListener('click', openReport);
document.getElementById('closeReportBtn').addEventListener('click', () => document.getElementById('reportOverlay').classList.remove('open'));
document.getElementById('printBtn').addEventListener('click', () => window.print());

loadData();
</script>
</body>
</html>
